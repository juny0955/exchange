receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 1s

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: exchange

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  otlp/loki:
    endpoint: loki:9095
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [ otlp ]
      processors: [ batch ]
      exporters: [ prometheus ]
    traces:
      receivers: [ otlp ]
      processors: [ batch ]
      exporters: [ otlp/tempo ]
    logs:
      receivers: [ otlp ]
      processors: [ batch ]
      exporters: [ otlp/loki ]
